 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adoption Hub - Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <div class="navbar">
    <div class="logo">Adoption Hub</div>
    <div class="nav-links">
      <a href="#" class="active">Home</a>
      <a href="#">Adopt</a>
      <a href="#">About Us</a>
      <a href="#">Contact</a>
    </div>
  </div>

  <!-- Main Website Content -->
  <div class="main-content">

    <!-- Search and Categories -->
    <div class="filter-section">
      <input type="text" class="search-input" placeholder="Search pets by name, breed...">
      <div class="categories-list">
        <button class="cat-btn active">Dogs</button>
        <button class="cat-btn">Cats</button>
        <button class="cat-btn">Birds</button>
        <button class="cat-btn">Rabbits</button>
      </div>
    </div>

    <!-- Pets Grid Section -->
    <div class="pets-grid">

      <!-- Pet Card 1 -->
      <div class="pet-card">
        <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=300" alt="Dog 1">
        <div class="pet-name">Buddy</div>
        <div class="pet-breed">Golden Retriever</div>
        <div class="pet-details">
          <span>2 Yrs</span>
          <span>Male</span>
        </div>
        <button class="action-btn">View Details</button>
      </div>

      <!-- Pet Card 2 -->
      <div class="pet-card">
        <img src="https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?w=300" alt="Dog 2">
        <div class="pet-name">Luna</div>
        <div class="pet-breed">French Bulldog</div>
        <div class="pet-details">
          <span>1 Yr</span>
          <span>Female</span>
        </div>
        <button class="action-btn">View Details</button>
      </div>

      <!-- Pet Card 3 -->
      <div class="pet-card">
        <img src="https://images.unsplash.com/photo-1537151608828-ea2b11777ee8?w=300" alt="Dog 3">
        <div class="pet-name">Max</div>
        <div class="pet-breed">German Shepherd</div>
        <div class="pet-details">
          <span>3 Yrs</span>
          <span>Male</span>
        </div>
        <button class="action-btn">View Details</button>
      </div>

    </div>

    <!-- Adoption Statistics Table Section -->
    <div class="table-section">
      <h3>Monthly Adoption Statistics</h3>
      <table class="adoption-table">
        <thead>
          <tr>
            <th>Pet Type</th>
            <th>Available</th>
            <th>Adopted This Month</th>
            <th>Pending Requests</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Dogs</td>
            <td>12</td>
            <td>28</td>
            <td>5</td>
          </tr>
          <tr>
            <td>Cats</td>
            <td>8</td>
            <td>19</td>
            <td>3</td>
          </tr>
          <tr>
            <td>Birds</td>
            <td>4</td>
            <td>7</td>
            <td>1</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

</body>
</html>
